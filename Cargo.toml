[package]
name = "pigeon"
version = "0.1.0"
edition = "2024"
description = "A fast, keyboard-driven, pure-Rust terminal email client with encryption at rest"
license = "WTFPL"

# ---------------------------------------------------------------------------
# Hard rule for this project: no C. Every dependency below must build without
# a C toolchain. That means:
#   * redb, not SQLite/SQLCipher
#   * rustls + graviola, not ring / aws-lc-rs / openssl
#   * rpgp, not a gpg(1) subprocess
#   * hand-rolled SMTP + OAuth2 clients, not lettre/mail-send/reqwest
# ---------------------------------------------------------------------------

[dependencies]
# ---- runtime ----
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "process", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
async-trait = "0.1"

# ---- terminal ui ----
ratatui = "0.30"
unicode-width = "0.2"
unicode-segmentation = "1"

# ---- mail protocols & formats ----
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
mail-parser = { version = "0.11", features = ["full_encoding", "serde"] }
mail-builder = "1"

# ---- tls: pure rust, provider supplied explicitly ----
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
rustls-native-certs = "0.8"

# ---- storage: pure rust embedded db ----
redb = "4"

# ---- crypto: encryption at rest + e2e ----
chacha20poly1305 = "0.11"
argon2 = "0.6"
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
rand = "0.9"
rand08 = { package = "rand", version = "0.8" }
rand_core = "0.9"
pgp = "0.20"

# ---- config / serde ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
shellexpand = "3"

# ---- misc ----
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
mime_guess = "2"
html2text = "0.17"
nucleo-matcher = "0.3"
open = "5"
crossbeam-channel = "0.5"

# ---- logging ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ---- desktop integration (dbus via pure-rust zbus) ----
notify-rust = "4"
keyring = "4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
# Full DWARF for this dependency graph costs several GB of build output for no
# benefit during normal development; line tables still give usable backtraces.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
